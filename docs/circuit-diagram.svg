<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="620" viewBox="0 0 1050 620"><title>Pi Zero 2 W PIR and externally powered pointer servo</title><rect width="1050" height="620" fill="white"/><g font-family="sans-serif" font-size="19" fill="#123"><text x="30" y="35">ID16: Pi Zero 2 W • BCM numbering • all GPIO3.3V</text><rect x="40" y="100" width="330" height="350" fill="#dff0df" stroke="#123"/><text x="60" y="140">Pi Zero 2 W</text><text x="60" y="215">BCM23 / physical pin16</text><text x="60" y="285">BCM17 / physical pin11</text><text x="60" y="365">GND / physical pin6</text><text x="60" y="420">MicroUSB 5V power input</text><rect x="640" y="95" width="360" height="160" fill="#edf6ff" stroke="#123"/><text x="660" y="135">PIR module (HC-SR501)</text><text x="660" y="175">VCC external5V;OUT3.3V→23</text><text x="660" y="215">GND common</text><rect x="640" y="280" width="360" height="145" fill="#edf6ff" stroke="#123"/><text x="660" y="315">Micro servo, loose pointer</text><text x="660" y="355">Signal←17;V+ external5V</text><text x="660" y="395">GND common</text><text x="35" y="505">Separate regulated5V≥1A →1A fuse →servo V+ and PIR VCC</text><text x="35" y="545">External supply− →common GND →Pi pin6 + PIR GND + servo GND</text><text x="35" y="585">Never backfeed Pi5V pins. Verify servo accepts3.3V PWM; no lock/door linkage.</text></g><g stroke="#267" stroke-width="3" fill="none"><path d="M370 210H550V175H640"/><path d="M370 280H590V355H640"/><path d="M370 360H510V455H1000"/></g></svg>